name: Build Sunspear Mod 26.1

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Распаковка архива
        run: unzip -o sunspear-mod-project.zip

      - name: Установка Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Поиск папки проекта и сборка
        run: |
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1))
          echo "Папка проекта найдена: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            echo "Файл gradlew не найден, запускаем системный Gradle..."
            gradle build
          fi

      - name: Сохранение готового JAR
        uses: actions/upload-artifact@v4
        with:
          name: sunspear-mod-26.1
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
