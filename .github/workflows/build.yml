name: Build Sunspear Mod 26.1

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Распаковка архива
        run: unzip -o sunspear-mod-project.zip

      - name: Установка Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Выдача прав Gradle
        run: chmod +x gradlew

      - name: Сборка мода
        run: ./gradlew build

      - name: Сохранение готового JAR
        uses: actions/upload-artifact@v4
        with:
          name: sunspear-mod-26.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
